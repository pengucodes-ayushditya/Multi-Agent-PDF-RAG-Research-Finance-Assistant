name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true
      - run: uv sync --locked --python 3.11
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
