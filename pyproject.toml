[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-pdf-rag-research-finance-assistant"
version = "0.1.0"
description = "LangGraph assistant combining PDF retrieval, research search, and financial data tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2", "langchain-core>=1.0,<2",
  "langchain-ollama>=1.0,<2", "langchain-groq>=1.0,<2",
  "pydantic>=2.10,<3", "python-dotenv>=1.0,<2", "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4", "pypdf>=5,<7", "yfinance>=0.2.65,<2",
  "ddgs>=9,<10", "defusedxml>=0.7,<1",
]

[project.scripts]
multi-assistant = "multi_assistant.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/multi_assistant"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/pyproject.toml", "/uv.lock",
           "/compose.yaml", "/.env.example", "/.gitignore", "/.github/workflows/ci.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest-temp"
markers = ["integration: requires running Ollama and PostgreSQL"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
